name: deck-sync-once
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: sync
        env:
          U: ${{ secrets.DECK_HOOK_URL }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          r=urllib.request.Request(os.environ["U"],data=json.dumps({"action":"task","id":"deck_sync"}).encode(),headers={"Content-Type":"application/json"})
          t=urllib.request.urlopen(r,timeout=360).read().decode()
          d=json.loads(t)
          print("ok",d.get("ok"))
          for l in str(d.get("log","")).splitlines():
              if "差し替え" in l or "失敗" in l or "流し込み" in l: print(l)
          PY
